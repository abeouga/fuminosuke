AWSTemplateFormatVersion: '2010-09-09'
Description: Fuminosuke invite-only beta. Tokyo, single Ubuntu 24.04 host; application release is separate.
Parameters:
  UbuntuImageId:
    Type: AWS::EC2::Image::Id
    Description: Verified Ubuntu Server 24.04 amd64 AMI in ap-northeast-1
  PublicHostname:
    Type: String
    AllowedPattern: '[a-z0-9][a-z0-9.-]+\.[a-z]{2,}'
  CognitoDomainPrefix:
    Type: String
    AllowedPattern: '[a-z0-9][a-z0-9-]{2,50}'
  InstallationId:
    Type: String
    AllowedPattern: '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}'
  NotificationEmail:
    Type: String
    Description: Operator-authorized budget notification address; required before release
    AllowedPattern: '[^@\s]+@[^@\s]+\.[^@\s]+'
Resources:
  Network:
    Type: AWS::EC2::VPC
    Properties: {CidrBlock: 10.92.0.0/24, EnableDnsSupport: true, EnableDnsHostnames: true}
  Internet:
    Type: AWS::EC2::InternetGateway
  InternetAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties: {VpcId: !Ref Network, InternetGatewayId: !Ref Internet}
  Subnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Network
      CidrBlock: 10.92.0.0/26
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: false
  Routes:
    Type: AWS::EC2::RouteTable
    Properties: {VpcId: !Ref Network}
  RouteAttachment:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: {SubnetId: !Ref Subnet, RouteTableId: !Ref Routes}
  DefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: InternetAttachment
    Properties: {RouteTableId: !Ref Routes, DestinationCidrBlock: 0.0.0.0/0, GatewayId: !Ref Internet}
  WebSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: HTTPS and redirect only; management through SSM
      VpcId: !Ref Network
      SecurityGroupIngress:
        - {IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: 0.0.0.0/0}
        - {IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0}
  JournalBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration: [{ServerSideEncryptionByDefault: {SSEAlgorithm: AES256}}]
      VersioningConfiguration: {Status: Enabled}
      OwnershipControls: {Rules: [{ObjectOwnership: BucketOwnerEnforced}]}
      PublicAccessBlockConfiguration: {BlockPublicAcls: true, IgnorePublicAcls: true, BlockPublicPolicy: true, RestrictPublicBuckets: true}
  BackupBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration: [{ServerSideEncryptionByDefault: {SSEAlgorithm: AES256}}]
      OwnershipControls: {Rules: [{ObjectOwnership: BucketOwnerEnforced}]}
      PublicAccessBlockConfiguration: {BlockPublicAcls: true, IgnorePublicAcls: true, BlockPublicPolicy: true, RestrictPublicBuckets: true}
      LifecycleConfiguration:
        Rules:
          - Id: SevenDayRecovery
            Status: Enabled
            Prefix: !Sub '${InstallationId}/backups/'
            ExpirationInDays: 7
            AbortIncompleteMultipartUpload: {DaysAfterInitiation: 1}
  JournalPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref JournalBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: TlsOnly
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource: [!GetAtt JournalBucket.Arn, !Sub '${JournalBucket.Arn}/*']
            Condition: {Bool: {'aws:SecureTransport': 'false'}}
          - Sid: NeverDeleteReceipts
            Effect: Deny
            Principal: '*'
            Action: ['s3:DeleteObject', 's3:DeleteObjectVersion']
            Resource: !Sub '${JournalBucket.Arn}/*'
          - Sid: ConditionalCreationOnly
            Effect: Deny
            Principal: '*'
            Action: 's3:PutObject'
            Resource: !Sub '${JournalBucket.Arn}/*'
            Condition: {'Null': {'s3:if-none-match': 'true'}}
  BackupPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref BackupBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource: [!GetAtt BackupBucket.Arn, !Sub '${BackupBucket.Arn}/*']
            Condition: {Bool: {'aws:SecureTransport': 'false'}}
          - Effect: Deny
            Principal: '*'
            Action: 's3:PutObject'
            Resource: !Sub '${BackupBucket.Arn}/*'
            Condition: {'Null': {'s3:if-none-match': 'true'}}
  ApiSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties: {Description: Operator supplies the OpenAI key before explicit AI activation; no value in template}
  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement: [{Effect: Allow, Principal: {Service: ec2.amazonaws.com}, Action: 'sts:AssumeRole'}]
      ManagedPolicyArns: [!Sub 'arn:${AWS::Partition}:iam::aws:policy/AmazonSSMManagedInstanceCore']
      Policies:
        - PolicyName: BetaPersistence
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ['s3:ListBucket']
                Resource: [!GetAtt JournalBucket.Arn, !GetAtt BackupBucket.Arn]
                Condition: {StringLike: {'s3:prefix': [!Sub '${InstallationId}/*']}}
              - Effect: Allow
                Action: ['s3:GetObject', 's3:PutObject']
                Resource: [!Sub '${JournalBucket.Arn}/${InstallationId}/*', !Sub '${BackupBucket.Arn}/${InstallationId}/*']
              - Effect: Allow
                Action: ['secretsmanager:GetSecretValue']
                Resource: !Ref ApiSecret
  Profile:
    Type: AWS::IAM::InstanceProfile
    Properties: {Roles: [!Ref InstanceRole]}
  DataVolume:
    Type: AWS::EC2::Volume
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      AvailabilityZone: !GetAtt Subnet.AvailabilityZone
      Encrypted: true
      Size: 30
      VolumeType: gp3
      Tags: [{Key: Name, Value: fuminosuke-beta-data}]
  Host:
    Type: AWS::EC2::Instance
    DependsOn: DefaultRoute
    Properties:
      ImageId: !Ref UbuntuImageId
      InstanceType: t3a.medium
      CreditSpecification: {CPUCredits: standard}
      IamInstanceProfile: !Ref Profile
      SubnetId: !Ref Subnet
      SecurityGroupIds: [!Ref WebSecurityGroup]
      MetadataOptions: {HttpEndpoint: enabled, HttpTokens: required, HttpPutResponseHopLimit: 2}
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs: {Encrypted: true, VolumeSize: 20, VolumeType: gp3, DeleteOnTermination: true}
      Tags: [{Key: Name, Value: fuminosuke-beta}]
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y docker.io docker-compose-v2 python3 xfsprogs curl unzip
          systemctl enable --now docker
          install -d -m 0700 /etc/llmocr /opt/llmocr /var/lib/fuminosuke
          serial=$(printf '%s' '${DataVolume}' | tr -d '-')
          device=/dev/disk/by-id/nvme-Amazon_Elastic_Block_Store_$serial
          for attempt in $(seq 1 120); do [ -b "$device" ] && break; sleep 2; done
          test -b "$device"
          if ! blkid "$device"; then mkfs.xfs "$device"; fi
          uuid=$(blkid -s UUID -o value "$device")
          printf 'UUID=%s /var/lib/fuminosuke xfs defaults,nofail,prjquota 0 2\n' "$uuid" >> /etc/fstab
          mount /var/lib/fuminosuke
          install -d -o 10001 -g 10001 -m 0700 /var/lib/fuminosuke/data /var/lib/fuminosuke/work
          install -d -o 10001 -g 10001 -m 0700 /var/lib/fuminosuke/caddy
          # No source, API key, user account, invitation or AI activation is installed here.
  DataAttachment:
    Type: AWS::EC2::VolumeAttachment
    Properties: {InstanceId: !Ref Host, VolumeId: !Ref DataVolume, Device: /dev/sdf}
  Address:
    Type: AWS::EC2::EIP
    DependsOn: InternetAttachment
    Properties: {Domain: vpc}
  AddressBinding:
    Type: AWS::EC2::EIPAssociation
    Properties: {InstanceId: !Ref Host, AllocationId: !GetAtt Address.AllocationId}
  UserPool:
    Type: AWS::Cognito::UserPool
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      UserPoolName: fuminosuke-beta
      UserPoolTier: LITE
      AdminCreateUserConfig: {AllowAdminCreateUserOnly: true}
      Policies:
        PasswordPolicy: {MinimumLength: 12, RequireLowercase: true, RequireUppercase: true, RequireNumbers: true, RequireSymbols: true, TemporaryPasswordValidityDays: 3}
      MfaConfiguration: 'OFF'
      AccountRecoverySetting: {RecoveryMechanisms: [{Name: admin_only, Priority: 1}]}
      UsernameConfiguration: {CaseSensitive: false}
      DeletionProtection: ACTIVE
  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows: [code]
      AllowedOAuthScopes: [openid]
      SupportedIdentityProviders: [COGNITO]
      CallbackURLs: [!Sub 'https://${PublicHostname}/api/auth/callback']
      LogoutURLs: [!Sub 'https://${PublicHostname}/']
      PreventUserExistenceErrors: ENABLED
      EnableTokenRevocation: true
      AccessTokenValidity: 1
      IdTokenValidity: 1
      RefreshTokenValidity: 1
      TokenValidityUnits: {AccessToken: hours, IdToken: hours, RefreshToken: days}
  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties: {Domain: !Ref CognitoDomainPrefix, UserPoolId: !Ref UserPool}
  Budget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: fuminosuke-beta-monthly
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit: {Amount: 56, Unit: USD}
      NotificationsWithSubscribers:
        - Notification: {NotificationType: ACTUAL, ComparisonOperator: GREATER_THAN, Threshold: 70}
          Subscribers: [{SubscriptionType: EMAIL, Address: !Ref NotificationEmail}]
        - Notification: {NotificationType: ACTUAL, ComparisonOperator: GREATER_THAN, Threshold: 85}
          Subscribers: [{SubscriptionType: EMAIL, Address: !Ref NotificationEmail}]
        - Notification: {NotificationType: ACTUAL, ComparisonOperator: GREATER_THAN, Threshold: 100}
          Subscribers: [{SubscriptionType: EMAIL, Address: !Ref NotificationEmail}]
Outputs:
  PublicIp: {Value: !Ref Address}
  InstanceId: {Value: !Ref Host}
  JournalBucketName: {Value: !Ref JournalBucket}
  BackupBucketName: {Value: !Ref BackupBucket}
  ApiSecretArn: {Value: !Ref ApiSecret}
  CognitoPoolId: {Value: !Ref UserPool}
  CognitoClientId: {Value: !Ref UserPoolClient}
  CognitoDomain: {Value: !Sub 'https://${CognitoDomainPrefix}.auth.${AWS::Region}.amazoncognito.com'}

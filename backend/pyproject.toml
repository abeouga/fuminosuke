[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "document-ocr-backend"
version = "0.1.0"
description = "Local FastAPI backend for template-based document OCR and XLSX output"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic==1.16.4",
  "anthropic==2.3.0",
  "boto3==1.40.50",
  "fastapi==0.116.1",
  "jsonschema==4.23.0",
  "numpy==2.2.6",
  "openai==1.97.1",
  "opencv-contrib-python==4.10.0.84",
  "openpyxl==3.1.5",
  "pillow==11.3.0",
  "pypdfium2==5.12.1",
  "pypdf==6.10.0",
  "pydantic==2.11.7",
  "pydantic-settings==2.10.1",
  "psycopg[binary]==3.3.6",
  "PyJWT[crypto]==2.15.1",
  "python-multipart==0.0.20",
  "pyyaml==6.0.2",
  "sqlalchemy==2.0.41",
  "uvicorn[standard]==0.35.0",
  "websockets==16.1.1",
  "mcp==1.30.0",
]

[project.optional-dependencies]
layout-ocr = [
  "paddleocr>=3.0,<4.0",
  "paddlepaddle>=3.0,<4.0",
]
dev = [
  "fonttools==4.65.0",
  "httpx==0.28.1",
  "mypy==1.17.0",
  "pytest==8.4.1",
  "pytest-cov==6.2.1",
  "ruff==0.12.4",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers --disable-warnings"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# The MCP server's texts (tool descriptions, messages to the AI) are Japanese with fullwidth punctuation.
"app/mcp_server/*" = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy", "sqlalchemy.ext.mypy.plugin"]
exclude = ["alembic"]

[[tool.mypy.overrides]]
module = [
  "app.extraction.*",
  "app.image_processing.*",
  "app.segmentation.*",
  "app.template_recovery.*",
]
disable_error_code = [
  "arg-type",
  "assignment",
  "attr-defined",
  "call-overload",
  "no-any-return",
  "return-value",
]

[[tool.mypy.overrides]]
module = ["paddleocr", "yaml"]
ignore_missing_imports = true

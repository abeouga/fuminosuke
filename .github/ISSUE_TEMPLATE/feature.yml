name: Feature / Task
description: 新機能の実装や通常の開発タスク
title: "[Feature] "
labels:
  - Feature

body:
  - type: textarea
    id: purpose
    attributes:
      label: 目的
      description: このIssueで何を実現するのか記載してください。
      placeholder: 例）確定した書類を、欄の値で探せるようにする
    validations:
      required: true

  - type: textarea
    id: implementation
    attributes:
      label: 実装内容
      description: 実装する内容を具体的に記載してください。
      placeholder: |
        例）
        - POST /api/v2/structured/documents/search を追加
        - ライブラリの画面に、欄の値で絞り込む入力を足す
        - 確定した値（confirmed_results）から探す処理を app/structured/ に足す
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: 完了条件
      description: このIssueをCloseできる条件を記載してください。
      placeholder: |
        例）
        - 欄の値で、確定した書類だけが返る
        - 正常時に200を返す
        - 確定していない書類は返らない
        - 関連テストが成功する
    validations:
      required: true

  - type: textarea
    id: related
    attributes:
      label: 関連する設計・資料
      description: 関連する画面、API、クラス図、シーケンス図などがあれば記載してください。
      placeholder: 例）agorack-document の fuminosuke/docs/strategy/ の設計の文書、StructuredQueryService

  - type: textarea
    id: notes
    attributes:
      label: 補足
      description: その他必要な情報があれば記載してください。